name: Bug report
description: Report a problem with Koushi that you can reproduce.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please keep this report free of private
        data: never paste passwords, recovery keys, access tokens, key export
        files, message text, room or member names, or screenshots that show
        them.

        The diagnostics report is designed to omit all of that, so prefer it
        over a screenshot.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: |
        Example: After signing in, the room list stays empty while the status
        line says sync is running. I expected my rooms to appear.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that shows the problem.
      placeholder: |
        1. Sign in to example.invalid
        2. Open ...
        3. Select ...
        4. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Koushi version
      description: The version shown by **About Koushi** or **Check for Updates…** in the Koushi menu.
      placeholder: "0.22.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics file
      description: |
        Attach the diagnostics report as a **file**; it is too long to paste.

        1. Select **Open diagnostics** at the top right of the Koushi window.
        2. Select **Save to file…** and save `koushi-diagnostics.txt` to your
           Downloads folder.
        3. Drag and drop that file onto this field.

        Attach it when the problem involves sign-in, startup, sync, encryption,
        or a crash. For other problems, describe the symptom first; a
        maintainer will ask for the file when it helps.
      placeholder: Drag and drop koushi-diagnostics.txt here.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Diagnostics are designed to contain no private data: no message text,
        room or member names, Matrix IDs, email addresses, or file paths. They
        report session, sync, and cache state plus closed failure kinds and
        counts only, so they are safe to attach to a public issue. Open the file
        if you want to check its contents before attaching it.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no passwords, tokens, recovery keys, message text, or other private data.
          required: true
