name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Newer runs supersede in-flight ones. Key off head_ref for PRs so that GitHub
# recomputing refs/pull/N/merge (on mergeability changes) does not spuriously
# cancel an in-flight PR run; fall back to github.ref for push events.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck / vitest / build / secret-scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Secret scan
        run: npm run qa:secret-scan
      # --- Boundary enforcement (#87 Phase 0) ---
      # ESLint import-boundary rule: components must not import @tauri-apps
      # directly; no file may path-escape into src-tauri.
      - name: ESLint import boundaries
        run: npm run lint
      # Tauri adapter boundary: src-tauri must not call koushi_sdk directly.
      - name: Tauri adapter boundary check
        run: npm run lint:tauri-boundary
      # Domain-crate platform-dep deny-list: koushi-state must not gain
      # platform/OS deps (pre-seeds Phase 5 SecretStore port).
      - name: Domain-crate platform-dep check
        run: npm run lint:domain-deps

  browser-headless:
    name: Browser headless (Playwright DOM tier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      # Chromium only: the config drives one headless Chromium against the
      # Vite-served harness page and never launches a Tauri window.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # The repository treats browser-headless DOM proof as a primary gate for
      # GUI work, but nothing enforced it until now: a stale IPC-argument
      # assertion sat red on main from #319 until #323 found it by hand.
      - name: Browser-headless DOM tests
        run: npx playwright test

  rust:
    name: Rust (workspace / src-tauri / wasm)
    runs-on: ubuntu-latest
    env:
      # Keep CI artifacts under a predictable repo-local target dir.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-ci
    steps:
      - uses: actions/checkout@v4
        with:
          # The vendored Matrix SDK is a public submodule; recursive checkout
          # clones it over the HTTPS URL in .gitmodules without any secret.
          submodules: recursive
      - name: Install Rust toolchain (1.96.0 + wasm target)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # The root workspace owns the Tauri crate and the only Cargo.lock.
          workspaces: .
          shared-key: koushi-rust-ci
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Submodule sync guard
        run: node scripts/check-sdk-submodule.mjs
      - name: Workspace tests
        run: cargo test --workspace --exclude koushi-backend --exclude sidebar-composition --exclude key-management
      - name: Tauri DTO + IPC contract tests
        run: cargo test -p koushi-desktop
      - name: wasm build check (state + search)
        run: cargo check --target wasm32-unknown-unknown -p koushi-state -p koushi-search
      # --- Dependency hygiene (#87 Phase 0) ---
      # cargo-deny: license compliance + advisory check + bans.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - name: cargo-deny check
        run: cargo deny check
      # cargo-machete: detect unused Cargo.toml dependencies.
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - name: cargo-machete (unused deps)
        run: cargo machete

  core-homeserver:
    # Runs the Rust core against a real local homeserver. Nothing else in CI
    # exercises this tier, which is how #334 shipped: most focused scenarios
    # timed out at login while `--scenario=all` (the only one anybody ran by
    # hand) stayed green. Kept a separate job so it builds in parallel with the
    # Rust job rather than serialising behind it, keeps its own dependency
    # cache, and names itself when it fails.
    name: Core homeserver QA (conduit)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: koushi-core-homeserver-ci
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev zstd
      - name: Submodule sync guard
        run: node scripts/check-sdk-submodule.mjs
      - name: Install Conduit
        # Same prebuilt artifact the committed Linux GUI image pins, so CI and
        # the local lane run the same homeserver build.
        env:
          CONDUIT_URL: https://gitlab.com/api/v4/projects/famedly%2Fconduit/jobs/artifacts/master/raw/x86_64-unknown-linux-musl?job=artifacts
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -fsSLo "$HOME/.local/bin/conduit" "$CONDUIT_URL"
          chmod 0755 "$HOME/.local/bin/conduit"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Conduit is runnable
        run: conduit --version
      - name: QA binary unit tests
        # Also the only compile check for the QA binaries: a plain
        # `cargo test --workspace` skips them because both bin targets set
        # `required-features = ["qa-bin"]`, which is how a broken
        # `RoomCommand::SetSpaceChild` call sat on main undetected.
        run: cargo test -p koushi-core --features qa-bin --bin headless-core-qa
      - name: Core scenario — login and sync
        run: |
          node scripts/desktop-headless-local-qa.mjs --run \
            --server=conduit --scenario=login_sync --core --core-backend=probed \
            --timeout-ms=600000
      - name: Core scenario — media
        run: |
          node scripts/desktop-headless-local-qa.mjs --run \
            --server=conduit --scenario=media --core --core-backend=probed \
            --timeout-ms=600000
      - name: Upload QA logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-homeserver-qa-logs
          # Token-only QA output; the runner refuses to print child output that
          # fails its private-data validation.
          path: |
            .local-secrets/headless-local-qa/**/core-*.log
            .local-secrets/headless-local-qa/**/sdk-*.log
          if-no-files-found: ignore
          retention-days: 7

  windows-overlay-acl:
    name: Windows overlay ACL IPC
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-windows-overlay
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: koushi-windows-overlay-acl
      - name: Prove overlay set and clear cross the Tauri ACL
        run: cargo test -p koushi-windows-overlay-acl windows_overlay_ipc_is_authorized -- --nocapture
