[package]
name = "koushi-notify"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
koushi-key = { path = "../koushi-key" }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
