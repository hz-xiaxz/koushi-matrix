[package]
name = "koushi-store"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
koushi-diagnostics = { path = "../koushi-diagnostics" }
koushi-key = { path = "../koushi-key" }
koushi-protocol = { path = "../koushi-protocol" }
koushi-state = { path = "../koushi-state" }
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = "1"

[features]
test-hooks = []
