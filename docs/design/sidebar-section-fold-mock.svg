  <text class="t note" x="28" y="474">・左端の &#9662; はセクション全体を</text>
  <text class="t note" x="28" y="496">　隠す折りたたみ。別の操作。</text>
  <text class="t note" x="28" y="536">・畳むと先頭 5 件に戻り、末尾</text>
  <text class="t note" x="28" y="558">　に「残り 32 件を表示」が出る。</text>

