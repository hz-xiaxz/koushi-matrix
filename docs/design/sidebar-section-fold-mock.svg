  <text class="t note" x="28" y="188">セクション末尾のボタン。</text>
  <text class="t note" x="28" y="228">展開は 5 件のすぐ下なので</text>
  <text class="t note" x="28" y="250">押せる。畳むのは数十件の</text>
  <text class="t note" x="28" y="272">下なので、末尾まで送らない</text>
  <text class="t note" x="28" y="294">と押せない。</text>
