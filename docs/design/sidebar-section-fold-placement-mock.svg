  <!-- ===================== left annotation ===================== -->
  <text class="t caption" x="28" y="110">見出しの「畳む」ボタン位置（現状 → 提案）</text>
  <text class="t note" x="28" y="142">synthetic data only / 畳む = 展開したリストを先頭 5 件に戻す</text>

  <text class="t ok" x="28" y="196">A  ▾   セクション全体を隠す折りたたみ</text>
  <text class="t ok" x="28" y="222">C  ⌄⌄  表示を減らす（畳む）</text>

  <text class="t note" x="28" y="270">現状: C は右側にあり、作成（＋）と</text>
  <text class="t note" x="28" y="292">オプション（⋯）の間に混ざっている。</text>

  <text class="t note" x="28" y="340">提案: C を A のすぐ右へ動かし、</text>
  <text class="t note" x="28" y="362">表示に関わる操作を左にまとめる。</text>

  <text class="t warn" x="28" y="410">注意: 左群は見出しの余白までが</text>
  <text class="t warn" x="28" y="432">折りたたみのクリック領域。C を</text>
  <text class="t warn" x="28" y="454">置くと帯は C の手前で止まる。</text>

  <text class="t warn" x="28" y="502">▾ と ⌄⌄ が隣り合うため、区別は</text>
  <text class="t warn" x="28" y="524">ツールチップと aria-label で担保する。</text>

  <text class="t note" x="28" y="572">C の出現条件は変えない（Rust が</text>
  <text class="t note" x="28" y="594">shows_expand_control を立て、かつ</text>
  <text class="t note" x="28" y="616">展開中のときだけ出る）。</text>

